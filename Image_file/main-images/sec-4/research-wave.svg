<svg width="2400" height="700" viewBox="0 0 2400 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="waveStrokeA" x1="0" y1="350" x2="2400" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E7BFF" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#1E7BFF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#39A8FF" stop-opacity="0.42"/>
      <stop offset="0.82" stop-color="#1E7BFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#1E7BFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="waveStrokeB" x1="0" y1="350" x2="2400" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3CB7FF" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#3CB7FF" stop-opacity="0.12"/>
      <stop offset="0.55" stop-color="#62C6FF" stop-opacity="0.28"/>
      <stop offset="0.84" stop-color="#3CB7FF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#3CB7FF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="dotGlow" cx="0" cy="0" r="1" gradientTransform="translate(1200 350) rotate(90) scale(350 1200)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4CC3FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4CC3FF" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow2" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <pattern id="dotPattern" width="36" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#39A8FF" fill-opacity="0.2"/>
    </pattern>

    <mask id="fadeMask">
      <rect width="2400" height="700" fill="url(#maskGrad)"/>
    </mask>

    <linearGradient id="maskGrad" x1="0" y1="350" x2="2400" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="black"/>
      <stop offset="0.08" stop-color="white"/>
      <stop offset="0.92" stop-color="white"/>
      <stop offset="1" stop-color="black"/>
    </linearGradient>
  </defs>

  <!-- transparent background -->
  <g mask="url(#fadeMask)">
    <ellipse cx="1200" cy="370" rx="1200" ry="300" fill="url(#dotGlow)" opacity="0.28"/>

    <!-- very soft atmospheric ribbons -->
    <path d="M-80 430C280 260 560 250 890 365C1180 465 1440 495 1730 345C1990 210 2220 225 2480 350"
          stroke="#117DFF" stroke-opacity="0.08" stroke-width="42" filter="url(#softGlow2)"/>
    <path d="M-50 500C260 340 610 315 925 410C1245 507 1510 500 1795 380C2040 276 2245 278 2460 360"
          stroke="#32B8FF" stroke-opacity="0.05" stroke-width="28" filter="url(#softGlow2)"/>

    <!-- main flowing lines -->
    <path d="M-60 420C265 265 575 262 886 360C1170 449 1412 475 1702 348C1982 226 2202 228 2460 346"
          stroke="url(#waveStrokeA)" stroke-width="2.2" filter="url(#softGlow)"/>
    <path d="M-45 444C278 296 570 294 884 382C1170 462 1415 489 1702 366C1973 250 2200 248 2450 365"
          stroke="url(#waveStrokeB)" stroke-width="1.5"/>
    <path d="M-40 468C278 330 586 327 892 404C1172 475 1425 505 1704 390C1968 281 2198 275 2445 386"
          stroke="url(#waveStrokeA)" stroke-opacity="0.7" stroke-width="1.2"/>
    <path d="M-35 392C278 242 582 236 892 339C1177 434 1410 456 1695 328C1975 202 2204 210 2460 330"
          stroke="url(#waveStrokeB)" stroke-opacity="0.75" stroke-width="1.1"/>

    <!-- secondary hairlines -->
    <path d="M-90 515C245 385 580 360 900 430C1205 497 1450 530 1740 426C2010 330 2225 320 2480 398"
          stroke="#2A8DFF" stroke-opacity="0.11" stroke-width="0.8"/>
    <path d="M-70 366C240 215 566 200 900 315C1202 420 1430 432 1712 304C1980 182 2210 196 2470 315"
          stroke="#56C6FF" stroke-opacity="0.09" stroke-width="0.8"/>

    <!-- particle field clipped into the wave zone -->
    <path d="M-100 540C230 360 580 315 910 405C1210 486 1450 530 1770 400C2050 285 2250 292 2500 390L2500 520C2245 430 2030 426 1775 500C1465 592 1190 556 900 495C580 428 250 448-100 600Z"
          fill="url(#dotPattern)" opacity="0.22"/>

    <!-- sparse glow particles -->
    <g fill="#4AB9FF">
      <circle cx="280" cy="393" r="2.2" opacity="0.35"/>
      <circle cx="430" cy="347" r="1.5" opacity="0.24"/>
      <circle cx="610" cy="336" r="2.0" opacity="0.30"/>
      <circle cx="820" cy="374" r="1.4" opacity="0.22"/>
      <circle cx="1030" cy="430" r="2.2" opacity="0.30"/>
      <circle cx="1260" cy="458" r="1.6" opacity="0.25"/>
      <circle cx="1490" cy="442" r="1.8" opacity="0.28"/>
      <circle cx="1680" cy="374" r="2.4" opacity="0.36"/>
      <circle cx="1880" cy="307" r="1.5" opacity="0.22"/>
      <circle cx="2070" cy="285" r="2.0" opacity="0.30"/>
      <circle cx="2250" cy="320" r="1.5" opacity="0.20"/>
    </g>
  </g>
</svg>
